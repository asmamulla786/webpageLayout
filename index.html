<!DOCTYPE html>
<html>
  <head>
    <title>Webpage layout</title>
    <style>
      header {
        background-color: aqua;
        border: 2px solid;
        height: 250px;
        text-align: center;
        margin: 0px 8px 0px 8px;
      }
      aside {
        display: inline-block;
        background-color: rgb(255, 0, 0);
        text-align: center;
        width: 550px;
        height: 500px;
        border: 2px solid;
        margin: 0px 0px 0px 8px;
      }
      h2 {
        display: inline;
      }
      main {
        display: inline-block;
        text-align: center;
        width: 1207px;
        height: 500px;
        /* margin: 8px; */
        margin: 8px 0px 0px 8px;
        border: 2px solid;
        background-color: aquamarine;
      }
      footer {
        background-color: blueviolet;
        border: 2px solid;
        height: 250px;
        text-align: center;
        margin: 8px;
      }
    </style>
  </head>
  <body style="margin: 0px">
    <header><h1>This is header</h1></header>
    <aside><h2>This is aside</h2></aside>
    <main>
      <h2>This is main</h2>
    </main>
    <footer><h2>This is footer</h2></footer>
  </body>
</html>
